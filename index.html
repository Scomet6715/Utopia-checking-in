<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入口核销</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #result { margin-top: 20px; padding: 15px; font-size: 18px; border-radius: 8px; min-height: 30px; }
    .success { background: #d4edda; color: #155724; }
    .fail { background: #f8d7da; color: #721c24; }
    .info { background: #e2e3e5; color: #383d41; }
    .actions { margin-top: 20px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; margin: 4px; }
    #manual-input { margin-top: 20px; }
    #manual-input input { padding: 8px; font-size: 16px; width: 240px; }
  </style>
</head>
<body>
  <h2>扫码核销</h2>
  <div id="reader"></div>
  <div id="result" class="info">等待扫码...</div>

  <div id="manual-input">
    <input type="text" id="manualTicketId" placeholder="输入明文票号作为备用">
    <button onclick="handleManualInput()">手动核销</button>
  </div>

  <div class="actions">
    <button onclick="exportUsedTickets()">导出已核销记录</button>
    <button onclick="clearAllData()" style="background:#dc3545;color:white;">清空所有数据（慎用）</button>
  </div>

  <script>
    const STORAGE_KEY = 'used_tickets_v1';

    // ⚠️ 加密密钥：必须与生成页完全一致
    const SECRET_KEY = 'Utopia_QQ_XG_AT_6715';

    const TICKET_PATTERN = /^Utopia_\d{6}_\d{3,4}$/;

    // ---- 解密：Base64 → XOR ----
    function decrypt(encoded) {
      try {
        const binary = atob(encoded);
        const keyBytes = new TextEncoder().encode(SECRET_KEY);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        }
        const result = new TextDecoder().decode(bytes);
        // 解密结果应全部是可打印 ASCII 字符，否则视为无效
        if (/^[\x20-\x7E]+$/.test(result)) {
          return result;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function getUsedTickets() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function markAsUsed(ticketId) {
      const used = getUsedTickets();
      if (!used.includes(ticketId)) {
        used.push(ticketId);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(used));
        return true;
      }
      return false;
    }

    function showResult(type, text) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = type;
      resultDiv.textContent = text;
    }

    // ---- 核心核销流程 ----
    function processTicket(plainTicketId) {
      // 1. 格式校验
      if (!TICKET_PATTERN.test(plainTicketId)) {
        showResult('fail', `❌ 票号格式无效：${plainTicketId}`);
        return;
      }
      // 2. 重复检查
      const success = markAsUsed(plainTicketId);
      if (success) {
        showResult('success', `✅ 核销成功：${plainTicketId}`);
      } else {
        showResult('fail', `❌ 此票已使用：${plainTicketId}`);
      }
    }

    // ---- 扫码回调 ----
    let scanningPaused = false;

    function onScanSuccess(decodedText) {
      if (scanningPaused) return;
      scanningPaused = true;
      html5QrCode.pause();

      // 1. 解密
      const plain = decrypt(decodedText.trim());

      if (plain === null) {
        showResult('fail', '❌ 无法识别的二维码（解密失败）');
      } else {
        // 2. 格式校验 + 3. 重复检查
        processTicket(plain);
      }

      // 2.5 秒后恢复扫描
      setTimeout(() => {
        scanningPaused = false;
        html5QrCode.resume();
      }, 2500);
    }

    // ---- 手动输入备用（输入的是明文票号） ----
    function handleManualInput() {
      const input = document.getElementById('manualTicketId');
      const val = input.value.trim();
      if (!val) return;
      processTicket(val);
      input.value = '';
    }

    // ---- 初始化扫码器 ----
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: 250 };

    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          () => {}
        ).catch(err => {
          showResult('fail', '无法启动摄像头：' + err);
        });
      } else {
        showResult('fail', '未找到摄像头，请使用手动输入。');
      }
    }).catch(err => {
      showResult('fail', '摄像头权限获取失败：' + err);
    });

    // ---- 辅助功能 ----
    function exportUsedTickets() {
      const used = getUsedTickets();
      if (used.length === 0) { alert('暂无核销记录'); return; }
      const blob = new Blob([JSON.stringify(used, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `核销记录_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAllData() {
      if (confirm('确定要清空所有核销记录吗？此操作不可恢复。')) {
        localStorage.removeItem(STORAGE_KEY);
        showResult('info', '所有核销记录已清空。');
      }
    }
  </script>
</body>
</html>
