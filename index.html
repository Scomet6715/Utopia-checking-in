<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入口核销</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; background: #000; min-height: 200px; }
        /* 限制取景画面高度，避免竖屏流把取景框拉得很长；contain 只留黑边，不裁切 */
        #reader video { max-height: 60vh; object-fit: contain; }
        #result { margin-top: 20px; padding: 15px; font-size: 18px; border-radius: 8px; min-height: 30px; }
        .success { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #e2e3e5; color: #383d41; }
        .actions { margin-top: 20px; }
        button { padding: 10px 24px; font-size: 18px; cursor: pointer; margin: 6px; }
        #manual-input { margin-top: 20px; }
        #manual-input input { padding: 8px; font-size: 16px; width: 220px; }
        #mainBtn { background: #007bff; color: white; font-weight: bold; min-width: 180px; }
        #mainBtn:disabled { background: #6c757d; cursor: not-allowed; }

        #camTools { margin: 12px auto 0; max-width: 400px; font-size: 14px; color: #444; }
        #camTools select { width: 100%; padding: 8px; font-size: 15px; }
        #zoomRow { display: none; margin-top: 10px; align-items: center; gap: 8px; }
        #zoomRow input[type=range] { flex: 1; }
        #camInfo { margin-top: 8px; font-size: 12px; color: #888; word-break: break-all; text-align: left; }
    </style>
</head>
<body>
    <h2>扫码销</h2>

    <div>
        <button id="mainBtn" onclick="onMainBtnClick()" disabled>正在启动摄像头...</button>
    </div>

    <div id="reader"></div>

    <!-- 镜头切换 / 缩放调节 / 诊断信息 -->
    <div id="camTools">
        <select id="cameraSelect" onchange="onCameraChange()" disabled>
            <option>摄像头列表加载中...</option>
        </select>
        <div id="zoomRow">
            <span>缩放</span>
            <input type="range" id="zoomSlider" oninput="onZoomInput()">
            <span id="zoomLabel">1.0x</span>
        </div>
        <div id="camInfo"></div>
        <button onclick="resetCameraConfig()" style="font-size:13px;padding:4px 10px;margin-top:8px;">重置本机镜头设置</button>
    </div>

    <div id="result" class="info">正在获取摄像头权限...</div>

    <div id="manual-input">
        <input type="text" id="manualTicketId" placeholder="输入明文票号作为备用">
        <button onclick="handleManualInput()">手动核销</button>
    </div>

    <div class="actions">
        <button onclick="exportUsedTickets()">导出已核销记录</button>
        <button onclick="clearAllData()" style="background:#dc3545;color:white;">清空所有数据（慎用）</button>
    </div>

    <script>
        const STORAGE_KEY = 'used_tickets_v1';
        const CONFIG_KEY = 'camera_config_v2'; // 本设备的镜头与缩放偏好：{ id, label, zoom }
        const SECRET_KEY = 'Utopia_QQ_XG_AT_6715'; // 必须与生成页一致
        const TICKET_PATTERN = /^Utopia_\d{6}_\d{3,4}$/;

        // ---- 解密 ----
        function decrypt(encoded) {
            try {
                const binary = atob(encoded);
                const keyBytes = new TextEncoder().encode(SECRET_KEY);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
                }
                const result = new TextDecoder().decode(bytes);
                return /^[\x20-\x7E]+$/.test(result) ? result : null;
            } catch (e) { return null; }
        }

        function getUsedTickets() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        }

        function markAsUsed(ticketId) {
            const used = getUsedTickets();
            if (!used.includes(ticketId)) {
                used.push(ticketId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(used));
                return true;
            }
            return false;
        }

        function showResult(type, text) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = type;
            resultDiv.textContent = text;
        }

        // ---- 核销核心逻辑 ----
        function processTicket(plainTicketId) {
            if (!TICKET_PATTERN.test(plainTicketId)) {
                showResult('fail', `❌ 票号格式无效：${plainTicketId}`);
                return;
            }
            const success = markAsUsed(plainTicketId);
            if (success) {
                showResult('success', `✅ 核销成功：${plainTicketId}`);
            } else {
                showResult('fail', `❌ 此票已使用：${plainTicketId}`);
            }
        }

        // ---- 扫码器 ----
        const html5QrCode = new Html5Qrcode("reader");
        let state = 'idle';   // idle | ready | scanning
        let scanning = false; // 防重入 + 防止未点击时误核销
        let cameras = [];
        let currentCameraId = null;
        let currentTrack = null;
        let firstTimeOnDevice = false; // 本设备是否还没有保存过镜头设置

        // ---- 本设备的镜头/缩放偏好（存在浏览器本地，每台手机各存各的） ----
        function loadConfig() {
            try { return JSON.parse(localStorage.getItem(CONFIG_KEY)); } catch (e) { return null; }
        }
        function saveConfig(cfg) {
            try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
        }
        function resetCameraConfig() {
            if (!confirm('重置本机保存的镜头和缩放设置？页面将重新加载。')) return;
            try { localStorage.removeItem(CONFIG_KEY); } catch (e) {}
            location.reload();
        }

        function updateButton() {
            const btn = document.getElementById('mainBtn');
            btn.textContent = state === 'scanning' ? '⏹ 取消核销' : '🔍 开始核销';
        }

        // ---- 摄像头选择 ----
        function pickCamera(list) {
            const back = list.filter(c => /back|environment|rear|后置/i.test(c.label));
            const pool = back.length ? back : list;
            return (
                pool.find(c => /wide|广角/i.test(c.label) && !/ultra|超广角/i.test(c.label)) ||
                pool.find(c => !/tele|长焦|macro|微距|ultra|超广角/i.test(c.label)) ||
                pool[0]
            );
        }

        // 先触发授权，让 getCameras() 能拿到完整 label
        async function ensureCameraPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                console.warn('预授权失败：', e);
            }
        }

        function populateCameraSelect() {
            const sel = document.getElementById('cameraSelect');
            sel.innerHTML = '';
            cameras.forEach((c, i) => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${i + 1}. ${c.label || '摄像头'}`;
                sel.appendChild(opt);
            });
            if (currentCameraId) sel.value = currentCameraId;
            sel.disabled = cameras.length <= 1;
        }

        // ---- 缩放 / 诊断信息 ----
        function updateCamInfo() {
            const info = document.getElementById('camInfo');
            if (!currentTrack) { info.textContent = ''; return; }
            let s = {}, caps = {};
            try { s = currentTrack.getSettings(); } catch (e) {}
            try { caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {}; } catch (e) {}
            const zoomText = caps.zoom
                ? `zoom 范围 ${caps.zoom.min}~${caps.zoom.max}，当前 ${s.zoom ?? '未知'}`
                : '此设备/浏览器不支持 zoom 调节';
            info.textContent = `镜头：${currentTrack.label || '未知'} ｜ 分辨率：${s.width || '?'}x${s.height || '?'} ｜ ${zoomText}`;
        }

        async function setupZoomUI() {
            const row = document.getElementById('zoomRow');
            const slider = document.getElementById('zoomSlider');
            row.style.display = 'none';
            if (!currentTrack || !currentTrack.getCapabilities) { updateCamInfo(); return; }

            const caps = currentTrack.getCapabilities();
            if (caps.zoom) {
                // 有本机保存的缩放就用它；否则复位到 1x（若设备最小值更大则取最小值）
                const cfg = loadConfig();
                let target = (cfg && typeof cfg.zoom === 'number') ? cfg.zoom : Math.max(1, caps.zoom.min);
                target = Math.min(Math.max(target, caps.zoom.min), caps.zoom.max);
                try {
                    await currentTrack.applyConstraints({ advanced: [{ zoom: target }] });
                } catch (e) { console.warn('zoom 复位失败：', e); }

                const s = currentTrack.getSettings();
                slider.min = caps.zoom.min;
                slider.max = caps.zoom.max;
                slider.step = caps.zoom.step || 0.1;
                slider.value = s.zoom ?? target;
                document.getElementById('zoomLabel').textContent = Number(slider.value).toFixed(1) + 'x';
                row.style.display = 'flex';
            }

            // 对焦单独设置
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                try {
                    await currentTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                } catch (e) { console.warn('对焦设置失败：', e); }
            }
            updateCamInfo();
        }

        async function onZoomInput() {
            const slider = document.getElementById('zoomSlider');
            const v = parseFloat(slider.value);
            document.getElementById('zoomLabel').textContent = v.toFixed(1) + 'x';
            if (!currentTrack) return;
            try {
                await currentTrack.applyConstraints({ advanced: [{ zoom: v }] });
                const cfg = loadConfig() || {};
                saveConfig({ ...cfg, id: currentCameraId, zoom: v });
                updateCamInfo();
            } catch (e) { console.warn('zoom 调节失败：', e); }
        }

        // ---- 启动指定摄像头（不指定分辨率，保持浏览器默认的取景比例） ----
        async function startCamera(cameraId) {
            await html5QrCode.start(
                { deviceId: { exact: cameraId } },
                {
                    fps: 15,
                    qrbox: (w, h) => {
                        const size = Math.min(300, Math.max(150, Math.floor(Math.min(w, h) * 0.7)));
                        return { width: size, height: size };
                    }
                },
                onScanSuccess,
                () => {}
            );
            currentCameraId = cameraId;
            // 保存镜头选择；若仍是同一个镜头（按 id 或 label 判断），保留之前存的缩放
            const cam = cameras.find(c => c.id === cameraId);
            const prev = loadConfig();
            const sameCam = prev && (prev.id === cameraId || (prev.label && cam && prev.label === cam.label));
            saveConfig({
                id: cameraId,
                label: cam ? cam.label : '',
                zoom: sameCam && typeof prev.zoom === 'number' ? prev.zoom : null
            });

            const video = document.querySelector('#reader video');
            currentTrack = (video && video.srcObject) ? video.srcObject.getVideoTracks()[0] : null;
            await setupZoomUI();
        }

        async function bootCamera(autoScan) {
            const btn = document.getElementById('mainBtn');
            btn.disabled = true;

            try {
                await ensureCameraPermission();
                cameras = await Html5Qrcode.getCameras();
                console.log('摄像头列表：', cameras);
                if (!cameras.length) throw new Error('未找到可用摄像头');

                // 优先使用本机保存的镜头（按 id 匹配，id 变了则按 label 匹配），否则自动挑选
                const cfg = loadConfig();
                const saved = cfg && (
                    cameras.find(c => c.id === cfg.id) ||
                    (cfg.label ? cameras.find(c => c.label === cfg.label) : null)
                );
                firstTimeOnDevice = !saved;
                const chosen = saved || pickCamera(cameras);

                currentCameraId = chosen.id;
                populateCameraSelect();
                await startCamera(chosen.id);
            } catch (err) {
                state = 'idle';
                btn.disabled = false;
                updateButton();
                showResult('fail', '摄像头启动失败，请点击按钮重试：' + err);
                return;
            }

            if (autoScan) {
                state = 'scanning';
                scanning = true;
                btn.disabled = false;
                updateButton();
                showResult('info', '请将二维码对准取景框...');
            } else {
                try { await html5QrCode.pause(); } catch (e) {}
                state = 'ready';
                btn.disabled = false;
                updateButton();
                showResult('info', firstTimeOnDevice
                    ? '首次在本设备使用：若画面过大或过小，请在下方切换镜头或拖动缩放，设置会自动记住。调好后点击“开始核销”'
                    : '摄像头已就绪，点击“开始核销”扫描');
            }
        }

        // ---- 手动切换镜头 ----
        async function onCameraChange() {
            const sel = document.getElementById('cameraSelect');
            const btn = document.getElementById('mainBtn');
            const newId = sel.value;
            if (!newId || newId === currentCameraId) return;

            btn.disabled = true;
            sel.disabled = true;
            scanning = false;
            showResult('info', '正在切换镜头...');
            try { await html5QrCode.stop(); } catch (e) {}
            currentTrack = null;

            try {
                await startCamera(newId);
                try { await html5QrCode.pause(); } catch (e) {}
                state = 'ready';
                showResult('info', '镜头已切换，点击“开始核销”扫描');
            } catch (err) {
                state = 'idle';
                showResult('fail', '切换镜头失败：' + err);
            }
            sel.disabled = cameras.length <= 1;
            btn.disabled = false;
            updateButton();
        }

        // ---- 开始识别 ----
        async function startScanning() {
            try {
                await html5QrCode.resume();
            } catch (e) {
                showResult('fail', '启动识别失败：' + e);
                return;
            }
            scanning = true;
            state = 'scanning';
            updateButton();
            showResult('info', '请将二维码对准取景框...');
        }

        // ---- 暂停识别（摄像头不关） ----
        async function pauseScanning(message) {
            scanning = false;
            try { await html5QrCode.pause(); } catch (e) {}
            state = 'ready';
            updateButton();
            if (message) showResult('info', message);
        }

        // ---- 主按钮 ----
        async function onMainBtnClick() {
            if (state === 'idle') {
                await bootCamera(true);
                return;
            }
            if (state === 'ready') {
                await startScanning();
                return;
            }
            if (state === 'scanning') {
                await pauseScanning('已取消本次核销');
                return;
            }
        }

        // ---- 扫码成功回调 ----
        async function onScanSuccess(decodedText) {
            if (!scanning) return;
            scanning = false;

            try { await html5QrCode.pause(); } catch (e) {}
            state = 'ready';
            updateButton();

            const plain = decrypt(decodedText.trim());
            if (plain === null) {
                showResult('fail', '❌ 无法识别的二维码（解密失败）');
                return;
            }
            processTicket(plain);
        }

        // ---- 手动输入 ----
        function handleManualInput() {
            const input = document.getElementById('manualTicketId');
            const val = input.value.trim();
            if (!val) return;
            processTicket(val);
            input.value = '';
        }

        // ---- 辅助功能 ----
        function exportUsedTickets() {
            const used = getUsedTickets();
            if (used.length === 0) { alert('暂无核销记录'); return; }
            const blob = new Blob([JSON.stringify(used, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `核销记录_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('确定要清空所有核销记录吗？此操作不可恢复。')) {
                localStorage.removeItem(STORAGE_KEY);
                showResult('info', '所有核销记录已清空。');
            }
        }

        // ---- 页面加载：自动申请权限、启动摄像头并暂停 ----
        window.addEventListener('load', () => {
            updateButton();
            bootCamera(false);
        });
    </script>
</body>
</html>
