<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入口核销</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; background: #000; min-height: 200px; }
        #result { margin-top: 20px; padding: 15px; font-size: 18px; border-radius: 8px; min-height: 30px; }
        .success { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #e2e3e5; color: #383d41; }
        .actions { margin-top: 20px; }
        button { padding: 10px 24px; font-size: 18px; cursor: pointer; margin: 6px; }
        #manual-input { margin-top: 20px; }
        #manual-input input { padding: 8px; font-size: 16px; width: 220px; }
        #mainBtn { background: #007bff; color: white; font-weight: bold; min-width: 180px; }
        #mainBtn:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>码核销</h2>

    <div>
        <button id="mainBtn" onclick="onMainBtnClick()" disabled>正在启动摄像头...</button>
    </div>

    <div id="reader"></div>
    <div id="result" class="info">正在获取摄像头权限...</div>

    <div id="manual-input">
        <input type="text" id="manualTicketId" placeholder="输入明文票号作为备用">
        <button onclick="handleManualInput()">手动核销</button>
    </div>

    <div class="actions">
        <button onclick="exportUsedTickets()">导出已核销记录</button>
        <button onclick="clearAllData()" style="background:#dc3545;color:white;">清空所有数据（慎用）</button>
    </div>

    <script>
        const STORAGE_KEY = 'used_tickets_v1';
        const SECRET_KEY = 'Utopia_QQ_XG_AT_6715'; // 必须与生成页一致
        const TICKET_PATTERN = /^Utopia_\d{6}_\d{3,4}$/;

        // ---- 解密 ----
        function decrypt(encoded) {
            try {
                const binary = atob(encoded);
                const keyBytes = new TextEncoder().encode(SECRET_KEY);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
                }
                const result = new TextDecoder().decode(bytes);
                return /^[\x20-\x7E]+$/.test(result) ? result : null;
            } catch (e) { return null; }
        }

        function getUsedTickets() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        }

        function markAsUsed(ticketId) {
            const used = getUsedTickets();
            if (!used.includes(ticketId)) {
                used.push(ticketId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(used));
                return true;
            }
            return false;
        }

        function showResult(type, text) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = type;
            resultDiv.textContent = text;
        }

        // ---- 核销核心逻辑 ----
        function processTicket(plainTicketId) {
            if (!TICKET_PATTERN.test(plainTicketId)) {
                showResult('fail', `❌ 票号格式无效：${plainTicketId}`);
                return;
            }
            const success = markAsUsed(plainTicketId);
            if (success) {
                showResult('success', `✅ 核销成功：${plainTicketId}`);
            } else {
                showResult('fail', `❌ 此票已使用：${plainTicketId}`);
            }
        }

        // ---- 扫码器 ----
        const html5QrCode = new Html5Qrcode("reader");
        let state = 'idle';   // idle | ready | scanning
        let scanning = false; // 防重入 + 防止未点击时误核销

        function updateButton() {
            const btn = document.getElementById('mainBtn');
            if (state === 'scanning') {
                btn.textContent = '⏹ 取消核销';
            } else {
                btn.textContent = '🔍 开始核销';
            }
        }

        // ---- 选择摄像头：优先普通后置广角，避开长焦/微距/超广角 ----
        function pickCamera(cameras) {
            const back = cameras.filter(c => /back|environment|rear|后置/i.test(c.label));
            const pool = back.length ? back : cameras;
            return (
                pool.find(c => /wide|广角/i.test(c.label) && !/ultra|超广角/i.test(c.label)) ||
                pool.find(c => !/tele|长焦|macro|微距|ultra|超广角/i.test(c.label)) ||
                pool[0]
            );
        }

        // ---- 先触发授权，让 getCameras() 能拿到完整的 label ----
        async function ensureCameraPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                // 授权失败会在后续 getCameras / start 里再报错，这里忽略
                console.warn('预授权失败：', e);
            }
        }

        // ---- 启动后微调：缩放复位 + 连续对焦（两者分开设置，互不影响） ----
        async function applyCameraTweaks() {
            const video = document.querySelector('#reader video');
            if (!video || !video.srcObject) return;
            const track = video.srcObject.getVideoTracks()[0];
            if (!track) return;
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            console.log('摄像头能力：', caps);
            try { console.log('当前设置：', track.getSettings()); } catch (e) {}

            // 缩放：目标 1x；若设备最小值大于 1 则取最小值，并限制在 max 以内
            if (caps.zoom) {
                let target = Math.max(1, caps.zoom.min);
                if (caps.zoom.max !== undefined) target = Math.min(target, caps.zoom.max);
                try {
                    await track.applyConstraints({ advanced: [{ zoom: target }] });
                    console.log('已设置 zoom =', target);
                } catch (e) { console.warn('zoom 设置失败：', e); }
            }

            // 对焦：单独设置
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
                try {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                } catch (e) { console.warn('对焦设置失败：', e); }
            }
        }

        // ---- 启动摄像头 ----
        async function bootCamera(autoScan) {
            const btn = document.getElementById('mainBtn');
            btn.disabled = true;

            try {
                // 1. 先授权，保证能拿到摄像头 label
                await ensureCameraPermission();

                // 2. 枚举并挑选合适的镜头
                const cameras = await Html5Qrcode.getCameras();
                console.log('摄像头列表：', cameras);
                const chosenCamera = pickCamera(cameras);
                if (!chosenCamera) {
                    throw new Error('未找到可用摄像头');
                }

                // 3. 启动时就限制分辨率，避免拿到高分辨率/裁切放大的流
                await html5QrCode.start(
                    { deviceId: { exact: chosenCamera.id } },
                    {
                        fps: 15,
                        // 扫描框按视口比例，不写死像素
                        qrbox: (w, h) => {
                            const size = Math.max(150, Math.floor(Math.min(w, h) * 0.7));
                            return { width: size, height: size };
                        },
                        videoConstraints: {
                            deviceId: { exact: chosenCamera.id },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    },
                    onScanSuccess,
                    () => {}
                );
            } catch (err) {
                state = 'idle';
                btn.disabled = false;
                updateButton();
                showResult('fail', '摄像头启动失败，请点击按钮重试：' + err);
                return;
            }

            // 4. 启动后复位缩放、设置对焦
            await applyCameraTweaks();

            if (autoScan) {
                state = 'scanning';
                scanning = true;
                btn.disabled = false;
                updateButton();
                showResult('info', '请将二维码对准取景框...');
            } else {
                try { await html5QrCode.pause(); } catch (e) {}
                state = 'ready';
                btn.disabled = false;
                updateButton();
                showResult('info', '摄像头已就绪，点击“开始核销”扫描');
            }
        }

        // ---- 开始识别 ----
        async function startScanning() {
            try {
                await html5QrCode.resume();
            } catch (e) {
                showResult('fail', '启动识别失败：' + e);
                return;
            }
            scanning = true;
            state = 'scanning';
            updateButton();
            showResult('info', '请将二维码对准取景框...');
        }

        // ---- 暂停识别（摄像头不关） ----
        async function pauseScanning(message) {
            scanning = false;
            try { await html5QrCode.pause(); } catch (e) {}
            state = 'ready';
            updateButton();
            if (message) showResult('info', message);
        }

        // ---- 主按钮 ----
        async function onMainBtnClick() {
            if (state === 'idle') {
                await bootCamera(true);
                return;
            }
            if (state === 'ready') {
                await startScanning();
                return;
            }
            if (state === 'scanning') {
                await pauseScanning('已取消本次核销');
                return;
            }
        }

        // ---- 扫码成功回调 ----
        async function onScanSuccess(decodedText) {
            if (!scanning) return;
            scanning = false;

            try { await html5QrCode.pause(); } catch (e) {}
            state = 'ready';
            updateButton();

            const plain = decrypt(decodedText.trim());
            if (plain === null) {
                showResult('fail', '❌ 无法识别的二维码（解密失败）');
                return;
            }
            processTicket(plain);
        }

        // ---- 手动输入 ----
        function handleManualInput() {
            const input = document.getElementById('manualTicketId');
            const val = input.value.trim();
            if (!val) return;
            processTicket(val);
            input.value = '';
        }

        // ---- 辅助功能 ----
        function exportUsedTickets() {
            const used = getUsedTickets();
            if (used.length === 0) { alert('暂无核销记录'); return; }
            const blob = new Blob([JSON.stringify(used, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `核销记录_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('确定要清空所有核销记录吗？此操作不可恢复。')) {
                localStorage.removeItem(STORAGE_KEY);
                showResult('info', '所有核销记录已清空。');
            }
        }

        // ---- 页面加载：自动申请权限、启动摄像头并暂停 ----
        window.addEventListener('load', () => {
            updateButton();
            bootCamera(false);
        });
    </script>
</body>
</html>
